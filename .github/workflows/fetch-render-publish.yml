name: Refresh data, render, deploy (Quarto)

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"  # daily 18:00 UTC

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    # Pinned so the PPM distro codename in RENV_CONFIG_REPOS_OVERRIDE matches.
    # If you bump this, bump the codename below to match.
    runs-on: ubuntu-24.04

    env:
      # renv restores against the repositories recorded in renv.lock, which
      # point at source CRAN. Without this override it compiles every package
      # from source and rlang fails to build.
      RENV_CONFIG_REPOS_OVERRIDE: https://packagemanager.posit.co/cran/__linux__/noble/latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'  # must match the R version pinned in renv.lock
          use-public-rspm: true

      - name: Restore renv (cached)
        uses: r-lib/actions/setup-renv@v2

      # Pull + clean your sheet data
      - name: Fetch data from Google Sheet (published CSV)
        run: Rscript scripts/01_fetch_data.R

      - name: Clean and validate data
        run: Rscript scripts/02_clean_validate.R

      # Render site (DT reads data/processed/submissions_cleaned.csv)
      - name: Render site
        run: quarto render

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
